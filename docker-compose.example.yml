# Example Compose file for scan2graph.
#
# Run this file, then open http://127.0.0.1:8080/setup (or your reverse proxy):
#   docker compose -f docker-compose.example.yml up -d
#
# The first-boot wizard saves /config/scan2graph.env. See README.md for the
# reverse proxy and the advanced/manual environment variable reference.
services:
  scan2graph:
    image: ghcr.io/georg-jung/scan2graph:latest
    restart: unless-stopped
    environment:
      S2G_CONFIG_FILE: /config/scan2graph.env
    volumes:
      - scan2graph-config:/config

    ports:
      # HTTP is only for the reverse proxy running on this same host, so it
      # is bound to loopback, not published on the LAN.
      - "127.0.0.1:8080:8080"
      # SMTP is what the printer connects to, so it has to be reachable from
      # the rest of the LAN segment - adjust the address if this host has
      # more than one interface and you want to restrict it further.
      - "2525:2525"

    # Configuration is the only persistent state; jobs remain ephemeral.
    read_only: true
    tmpfs:
      # The one directory scan2graph writes to (S2G_TEMP_DIR defaults to /tmp).
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  scan2graph-config:
