{{define "layout" -}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}} – {{end}}scan2graph</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">scan2graph</a>
  {{if .SignedIn}}
  <form method="post" action="/auth/logout">
    <span class="muted">{{.User}}</span>
    <button type="submit">Sign out</button>
  </form>
  {{end}}
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{- end}}
